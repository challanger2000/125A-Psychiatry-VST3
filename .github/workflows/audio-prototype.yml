name: P006 Nine-World Quality and CPU Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: DSP test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile audio prototype
        run: cmake --build build --config Release --parallel 2
      - name: Run realtime DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render comparison audio
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "./build/Release/render_paranoia.exe" "artifacts/Paranoia_P001"
      - name: Render DEPRESSION, OBSESSION and combined samples
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "./build/Release/render_dark_macros.exe" "artifacts/P003"
      - name: Render MANIA, PANIC and PSYCHOSIS samples
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "./build/Release/render_three_worlds.exe" "artifacts/P004"
      - name: Render three spectral macro comparisons
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "./build/Release/render_spectral_worlds.exe" "artifacts/P005"
      - name: Objective 120-case quality and CPU audit
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "./build/Release/audit_p006.exe" > "artifacts/P006_quality_audit.csv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "artifacts/P006_quality_audit.csv" | Select-Object -First 4
      - name: Publish example WAV pair (not a plugin)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: P006-Nine-Macro-Audio-and-Quality-Audit
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
