name: P009 GUI Runtime Smoke (Steinberg EditorHost)

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'tools/verify_artwork.py'
      - 'vst3/**'
      - 'resource/**'
      - 'src/**'
      - 'sound-library/**'
      - 'tools/prepare_acoustic_bank.py'
      - 'CMakeLists.txt'
      - '.github/workflows/gui-smoke.yml'
      - 'tools/gui_smoke.ps1'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: psychiatry-gui-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorhost-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sufficient native display space before build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep -Seconds 2
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          Write-Host "P028j desktop $($screen.Bounds.Width)x$($screen.Bounds.Height), work area $($screen.WorkingArea.Width)x$($screen.WorkingArea.Height)"
          if ($screen.Bounds.Width -ne 1920 -or $screen.Bounds.Height -ne 1080 -or $screen.WorkingArea.Width -lt 1200 -or $screen.WorkingArea.Height -lt 840) {
            throw 'P028j test environment cannot accommodate the 75% editor; no build attempted'
          }
      - uses: actions/setup-python@v5
        id: acoustic-python
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build-time acoustic decoder
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Fetch pinned Steinberg SDK including official EditorHost
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          git -C external/vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C external/vst3sdk submodule update --init --recursive
      - name: Configure actual Windows VSTGUI and Steinberg editorhost
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 "-DPython3_EXECUTABLE=${{ steps.acoustic-python.outputs.python-path }}" -G "Visual Studio 17 2022" -A x64 -DPSYCHIATRY_BUILD_VST3=ON -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=ON -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON
      - name: Build Windows VST3 and official Steinberg GUI host
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release --target PsychiatryPrototype editorhost test_native_followup --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attempt real Win32 editor attachment
        shell: pwsh
        run: |
          & "./tools/gui_smoke.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native DLL follow-up recall, resize refusal and interrupted fade
        shell: pwsh
        run: |
          $hostExe = Get-ChildItem build-vst3 -Recurse -File -Filter test_native_followup.exe | Select-Object -First 1
          $bundle = Get-ChildItem build-vst3 -Recurse -Directory -Filter 125A-PSYCHIATRY.vst3 | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $hostExe -or -not $bundle) { throw 'Native follow-up host or bundle missing' }
          $module = Join-Path $bundle.FullName 'Contents/x86_64-win/125A-PSYCHIATRY.vst3'
          & $hostExe.FullName $module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GUI smoke screenshot if captured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P009-EditorHost-Win32-GUI-Probe
          path: artifacts/P009-Editor-*.png
          if-no-files-found: ignore
          retention-days: 7
