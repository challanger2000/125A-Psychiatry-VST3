name: P021 Windows VST3 Dense Automation Stress

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Steinberg VST3 SDK 3.8.1
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          git -C external/vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C external/vst3sdk submodule update --init --recursive
          git -C external/vst3sdk rev-parse HEAD
      - name: Configure MSVC 2022 x64
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -DPSYCHIATRY_BUILD_VST3=ON -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=ON -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
      - name: Build real Windows VST3
        run: cmake --build build-vst3 --config Release --target PsychiatryPrototype --parallel 4
      - name: Build actual VST3 state regression harness
        run: cmake --build build-vst3 --config Release --target test_vst3_recall --parallel 4
      - name: Validate legacy project states v1-v4 with real VST3 processor/controller
        run: ctest --test-dir build-vst3 -C Release -R "^P006_VST3LegacyState$" --output-on-failure
      - name: Build real VST3 audio path metrology executable
        run: cmake --build build-vst3 --config Release --target test_vst3_audio_path --parallel 4
      - name: P010 real VST3 audio null tests, gain-placebo controls and THERAPY
        run: ctest --test-dir build-vst3 -C Release -R "^P010_ActualVST3AudioWetDry$" --output-on-failure
      - name: Check packaged VSTGUI definition and all parameter bindings
        shell: pwsh
        run: |
          $resource = @(Get-ChildItem -Path "build-vst3" -Recurse -File -Filter "psychiatry.uidesc")
          if ($resource.Count -eq 0) { throw "VSTGUI .uidesc missing from Windows build output" }
          $bundled = @($resource | Where-Object { $_.FullName -match '\.vst3[\\/]' })
          if ($bundled.Count -eq 0) { throw "VSTGUI XML exists, but not within a .vst3 bundle" }
          [xml]$ui = Get-Content -LiteralPath $bundled[0].FullName -Raw
          $controls = @($ui.SelectNodes("//view[@control-tag]"))
          $tags = @($controls | ForEach-Object { $_.GetAttribute("control-tag") })
          $must = @("DEPRESSION","PARANOIA","SCHIZOPHRENIA","MANIA","PANIC",
                    "DISSOCIATION","OBSESSION","HALLUCINATION","PSYCHOSIS",
                    "THERAPY","BYPASS")
          foreach ($tag in $must) {
            if ($tag -notin $tags) { throw "GUI missing host control: $tag" }
          }
          if (@($ui.SelectNodes("//view[@class='CKnob']")).Count -lt 10) {
            throw "Expected ten real VSTGUI rotary controls"
          }
          $randomize = @($ui.SelectNodes("//view[@class='CTextButton' and @control-tag='LOSS_OF_CONTROL' and @kick-style='true']"))
          if ($randomize.Count -ne 2) { throw "LOSS OF CONTROL must be available in both UI languages" }
          $randomTag = @($ui.SelectNodes("//control-tag[@name='LOSS_OF_CONTROL' and @tag='9000']"))
          if ($randomTag.Count -ne 1) { throw "Randomization UI-only tag not registered" }
          $views = @($ui.SelectNodes("//template[@name='view' or @name='view_de']"))
          if ($views.Count -ne 2) { throw "Expected English and German VSTGUI templates" }
          $language = @($ui.SelectNodes("//view[@class='CTextButton' and @control-tag='UI_LANGUAGE' and @kick-style='true']"))
          if ($language.Count -ne 2) { throw "Language selector must be present in both templates" }
          $uiLanguageTag = @($ui.SelectNodes("//control-tag[@name='UI_LANGUAGE' and @tag='9001']"))
          if ($uiLanguageTag.Count -ne 1) { throw "UI-only language tag missing" }
          $monitors = @($ui.SelectNodes("//view[@custom-view-name='PSYCHIATRY_DIAGNOSTIC']"))
          if ($monitors.Count -ne 2) { throw "Expected two diagnostic CRT views, EN and DE" }
          $rootViews = @($ui.SelectNodes("//template[@name='view' or @name='view_de']"))
          foreach ($panel in $rootViews) {
            if ($panel.GetAttribute("size") -ne "1004, 570") {
              throw "P009 panel must reserve dedicated CRT area"
            }
          }
          $motion = @($ui.SelectNodes("//view[@class='CCheckBox' and @control-tag='MONITOR_MOTION']"))
          if ($motion.Count -ne 2) { throw "Reduced-motion control missing in one GUI language" }
          $motionTag = @($ui.SelectNodes("//control-tag[@name='MONITOR_MOTION' and @tag='9002']"))
          if ($motionTag.Count -ne 1) { throw "Reduced-motion UI-only tag missing" }
          Write-Host "Verified EN/DE GUI + nine-scene CRT + reduced motion control:" ($must -join ", ")
      - name: Verify bundle and stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $bundles = @(Get-ChildItem -Path "build-vst3" -Recurse -Directory -Filter "*.vst3")
          $files = @(Get-ChildItem -Path "build-vst3" -Recurse -File -Filter "*.vst3")
          if ($bundles.Count -eq 0 -and $files.Count -eq 0) {
            throw "No built VST3 bundle/file found - CI must not claim success"
          }
          if ($bundles.Count -gt 0) {
            $chosen = $bundles | Sort-Object FullName | Select-Object -First 1
            Copy-Item -LiteralPath $chosen.FullName -Destination "artifacts" -Recurse -Force
            Write-Host "Staged bundle:" $chosen.FullName
          } else {
            $chosen = $files | Sort-Object FullName | Select-Object -First 1
            Copy-Item -LiteralPath $chosen.FullName -Destination "artifacts" -Force
            Write-Host "Staged VST3:" $chosen.FullName
          }
          Get-ChildItem artifacts -Recurse | Select-Object FullName,Length
      - name: Export real VST3 per-macro audio comparisons and metrology CSV
        shell: pwsh
        run: |
          $auditor = Get-ChildItem -LiteralPath "build-vst3" -Recurse -File -Filter "test_vst3_audio_path.exe" |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $auditor) { throw "Real VST3 audio auditor executable not found in MSVC build" }
          & $auditor.FullName "artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Import-Csv "artifacts/P010_actual_vst3_audio_metrics.csv")
          if ($rows.Count -ne 180) { throw "Expected 5 sources x 9 macros x 4 positions = 180 measured real VST3 audio rows" }
          if (-not (Test-Path "artifacts/P012_alias_and_cpu_metrics.csv")) {
            throw "P012 missing actual VST3 alias and CPU report"
          }
          $intermod = @(Import-Csv "artifacts/P015_multirate_intermod_metrics.csv")
          if ($intermod.Count -ne 75) {
            throw "P015 expected 27 wet-peak rows plus 48 high-band product rows, got $($intermod.Count)"
          }
          $phase = @(Import-Csv "artifacts/P016_phase_metrics.csv")
          $transient = @(Import-Csv "artifacts/P016_transient_metrics.csv")
          if ($phase.Count -ne 144 -or $transient.Count -ne 24) {
            throw "P016 expected 144 phase rows and 24 transient rows"
          }
          Write-Host "P016 phase/transient metrics:" $phase.Count $transient.Count
          Write-Host "P015 multi-rate and intermod measurements:" $intermod.Count
          Write-Host "P010 actual VST3 audio measurements:" $rows.Count
      - name: Attach P010 actual-processor audio metrology (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: P021-Real-VST3-Stress-Metrics
          path: |
            artifacts/P010_*
            artifacts/P012_*
            artifacts/P015_*
            artifacts/P016_*
          if-no-files-found: error
          retention-days: 7
      - name: Attach experimental VST3 (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: 125A-PSYCHIATRY-P021-Stress-NOT-FINAL
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
