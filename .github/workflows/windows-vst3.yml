name: P028 Windows VST3 Raster Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/gui_smoke.ps1'
      - '.github/workflows/gui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: acoustic-python
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build-time acoustic decoder
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Fetch pinned Steinberg VST3 SDK 3.8.1
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          git -C external/vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C external/vst3sdk submodule update --init --recursive
          git -C external/vst3sdk rev-parse HEAD
      - name: Configure MSVC 2022 x64
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 "-DPython3_EXECUTABLE=${{ steps.acoustic-python.outputs.python-path }}" -G "Visual Studio 17 2022" -A x64 -DPSYCHIATRY_BUILD_VST3=ON -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=ON -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
      - name: Build real Windows VST3
        run: cmake --build build-vst3 --config Release --target PsychiatryPrototype --parallel 4
      - name: Build actual VST3 state regression harness
        run: cmake --build build-vst3 --config Release --target test_vst3_recall --parallel 4
      - name: Validate v1-v5 state and twelve-world randomizer with real VST3 processor/controller
        run: ctest --test-dir build-vst3 -C Release -R "^P006_VST3LegacyState$" --output-on-failure
      - name: Build real VST3 audio path metrology executable
        id: build-audio-auditor
        run: cmake --build build-vst3 --config Release --target test_vst3_audio_path --parallel 4
      - name: P010 real VST3 audio null tests, gain-placebo controls and THERAPY
        run: ctest --test-dir build-vst3 -C Release -R "^P010_ActualVST3AudioWetDry$" --output-on-failure
      - name: Verify P028 raster bundle and stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          $bundles = @(Get-ChildItem -Path "build-vst3" -Recurse -Directory -Filter "125A-PSYCHIATRY.vst3" |
            Where-Object { $_.FullName -match '[\\/]VST3[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) { throw "Expected exactly one branded Windows VST3 bundle, got $($bundles.Count)" }
          $chosen = $bundles[0]
          python tools/verify_artwork.py . "$($chosen.FullName)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "plugin-package" | Out-Null
          Copy-Item -LiteralPath $chosen.FullName -Destination "plugin-package" -Recurse -Force
          python tools/verify_artwork.py . "plugin-package/125A-PSYCHIATRY.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_package_rejection.py . "plugin-package/125A-PSYCHIATRY.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_package_followup.py plugin-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_package_zip.py plugin-package artifacts/125A-PSYCHIATRY-P028l.zip extracted-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exact = (Resolve-Path "extracted-candidate/125A-PSYCHIATRY.vst3").Path
          python tools/verify_artwork.py . "$exact"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_loader.py "$exact/Contents/x86_64-win/125A-PSYCHIATRY.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "build-vst3/bin/Release/validator.exe" "$exact"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Staged branded plugin:" $chosen.FullName
          Get-ChildItem plugin-package -Recurse | Select-Object FullName,Length
      - name: Export real VST3 per-macro audio comparisons and metrology CSV
        shell: pwsh
        run: |
          $auditor = Get-ChildItem -LiteralPath "build-vst3" -Recurse -File -Filter "test_vst3_audio_path.exe" |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $auditor) { throw "Real VST3 audio auditor executable not found in MSVC build" }
          & $auditor.FullName "artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows = @(Import-Csv "artifacts/P010_actual_vst3_audio_metrics.csv")
          if ($rows.Count -ne 240) { throw "Expected 5 sources x 12 macros x 4 positions = 240 measured real VST3 audio rows" }
          if (-not (Test-Path "artifacts/P012_alias_and_cpu_metrics.csv")) {
            throw "P012 missing actual VST3 alias and CPU report"
          }
          $intermod = @(Import-Csv "artifacts/P015_multirate_intermod_metrics.csv")
          if ($intermod.Count -ne 84) {
            throw "P015 expected 36 wet-peak rows plus 48 high-band product rows, got $($intermod.Count)"
          }
          $phase = @(Import-Csv "artifacts/P016_phase_metrics.csv")
          $transient = @(Import-Csv "artifacts/P016_transient_metrics.csv")
          if ($phase.Count -ne 144 -or $transient.Count -ne 24) {
            throw "P016 expected 144 phase rows and 24 transient rows"
          }
          Write-Host "P016 phase/transient metrics:" $phase.Count $transient.Count
          Write-Host "P015 multi-rate and intermod measurements:" $intermod.Count
          Write-Host "P010 actual VST3 audio measurements:" $rows.Count
      - name: Attach P010 actual-processor audio metrology (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: P024-Real-VST3-Integrity-Metrics
          path: |
            artifacts/P010_*
            artifacts/P012_*
            artifacts/P015_*
            artifacts/P016_*
          if-no-files-found: error
          retention-days: 7
      - name: Attach experimental VST3 (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: 125A-PSYCHIATRY-P028-RASTER-NOT-FINAL
          path: |
            artifacts/125A-PSYCHIATRY-P028l.zip
            artifacts/125A-PSYCHIATRY-P028l.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Practical hosted deadline matrix 44.1 and 48 kHz
        if: ${{ !cancelled() && steps.build-audio-auditor.outcome == 'success' }}
        shell: pwsh
        run: |
          $auditor = Get-ChildItem build-vst3 -Recurse -File -Filter test_vst3_audio_path.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $auditor) { throw 'Practical actual processor harness missing' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $auditor.FullName --rt-practice artifacts/P028v-Practical-deadlines.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: R01 four-instance 96 kHz / 64 frame deadline evidence
        if: ${{ !cancelled() && steps.build-audio-auditor.outcome == 'success' }}
        shell: pwsh
        run: |
          $auditor = Get-ChildItem build-vst3 -Recurse -File -Filter test_vst3_audio_path.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $auditor) { throw 'R01 actual processor harness missing' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $auditor.FullName --rt-followup artifacts/P028l-RT-deadlines.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain raw R01 measurement even on missed deadlines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P028l-R01-Hosted-Deadline-Evidence
          path: |
            artifacts/P028l-RT-deadlines.csv
            artifacts/P028v-Practical-deadlines.csv
          if-no-files-found: ignore
          retention-days: 7
